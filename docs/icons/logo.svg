<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient)"/>
  
  <!-- Tab shape -->
  <g transform="translate(128, 160)">
    <!-- Main tab body -->
    <rect x="40" y="60" width="176" height="140" rx="12" fill="white" opacity="0.95"/>
    
    <!-- Tab top protrusion -->
    <rect x="60" y="40" width="96" height="32" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Bookmark/folder accent -->
    <path d="M 76 80 L 76 180 L 112 160 L 148 180 L 148 80 Z" fill="url(#gradient)" opacity="0.8"/>
    
    <!-- Checkmark -->
    <path d="M 100 120 L 116 140 L 140 100" stroke="url(#gradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Secondary tab hint (smaller, behind) -->
  <g transform="translate(280, 180) scale(0.6)">
    <rect x="40" y="60" width="176" height="140" rx="12" fill="white" opacity="0.3"/>
    <rect x="60" y="40" width="96" height="32" rx="8" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Shield/keeper accent ring -->
  <circle cx="256" cy="256" r="200" stroke="white" stroke-width="3" fill="none" opacity="0.2"/>
</svg>
