<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>Tab Keeper SNF - Kiosk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { font-size: 28px; color: #2563eb; margin-bottom: 10px; }
    .variant { 
      background: #dbeafe; color: #1e40af; 
      padding: 8px 16px; border-radius: 20px; 
      font-weight: 600; margin-bottom: 20px; display: inline-block;
    }
    .status {
      background: #eff6ff; border: 2px solid #2563eb;
      border-radius: 12px; padding: 20px; margin: 20px 0;
    }
    .status h2 { font-size: 16px; color: #1e40af; margin-bottom: 8px; }
    .timer { font-size: 48px; font-weight: 700; color: #2563eb; margin: 20px 0; }
    .urls { text-align: left; margin: 20px 0; }
    .url-item {
      background: #f8fafc; padding: 12px; margin: 8px 0;
      border-radius: 8px; border-left: 4px solid #2563eb;
    }
    .url-label { font-size: 12px; color: #64748b; text-transform: uppercase; }
    .url-value { font-size: 14px; color: #333; word-break: break-all; }
    button {
      padding: 14px 28px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      margin: 10px; background: #2563eb; color: white;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔖 Tab Keeper</h1>
    <div class="variant">SNF Variant</div>
    
    <div class="status">
      <h2>🚀 Launching Tabs...</h2>
      <p id="statusText">Opening PointClickCare tabs...</p>
    </div>
    
    <div class="timer" id="timer">05:00</div>
    
    <div class="urls">
      <div class="url-item">
        <div class="url-label">⭐ Primary (Arial)</div>
        <div class="url-value">https://10.1.129.207/Arial/#/login</div>
      </div>
      <div class="url-item">
        <div class="url-label">Secondary (Login)</div>
        <div class="url-value">https://login.pointclickcare.com/poc/userLogin.xhtml</div>
      </div>
    </div>
    
    <p style="color: #64748b; font-size: 13px; margin-top: 20px;">
      Credentials: <strong>snf / snf</strong><br>
      Auto-login enabled • Timer: 5 minutes
    </p>
  </div>

  <script>
    const PRIMARY_URL = 'https://10.1.129.207/Arial/#/login';
    const SECONDARY_URL = 'https://login.pointclickcare.com/poc/userLogin.xhtml';
    const CREDENTIALS = { username: 'snf', password: 'snf' };
    let countdown = 300;
    
    // Auto-launch immediately
    setTimeout(() => {
      window.location.href = PRIMARY_URL;
    }, 1000);
    
    // Timer countdown
    setInterval(() => {
      countdown--;
      if (countdown <= 0) countdown = 300;
      const m = Math.floor(countdown / 60).toString().padStart(2, '0');
      const s = (countdown % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }, 1000);
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw-pwa.js');
    }
  </script>
</body>
</html>
