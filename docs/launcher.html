<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Tab Keeper ALF - Kiosk Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #16a34a, #059669);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .box { background: white; border-radius: 16px; padding: 32px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    h1 { color: #16a34a; margin-bottom: 8px; }
    .badge { background: #dcfce7; color: #166534; padding: 6px 14px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 20px; }
    .status { background: #f0fdf4; border: 2px solid #16a34a; border-radius: 12px; padding: 16px; margin: 16px 0; text-align: left; }
    .log { font-family: monospace; font-size: 13px; color: #059669; line-height: 1.8; max-height: 200px; overflow-y: auto; }
    .timer { font-size: 42px; font-weight: 700; color: #16a34a; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .card { background: linear-gradient(135deg, #16a34a, #059669); color: white; padding: 16px; border-radius: 10px; text-align: left; }
    .card h3 { font-size: 11px; opacity: 0.9; margin-bottom: 6px; text-transform: uppercase; }
    .card .url { font-size: 12px; word-break: break-all; }
    .creds { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; margin: 16px 0; text-align: left; color: #92400e; font-size: 13px; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 8px; background: #16a34a; color: white; }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔖 Tab Keeper</h1>
    <div class="badge">ALF Variant</div>
    
    <div class="status">
      <strong>🚀 Status:</strong>
      <div class="log" id="log">Starting...</div>
    </div>
    
    <div class="timer" id="timer">05:00</div>
    
    <div class="grid">
      <div class="card">
        <h3>⭐ Arial</h3>
        <div class="url">https://10.1.129.207/Arial/#/login</div>
      </div>
      <div class="card">
        <h3>🏥 PCC</h3>
        <div class="url">https://login.pointclickcare.com</div>
      </div>
    </div>
    
    <div class="creds">
      <strong>Credentials:</strong><br>
      User: <code>alfstaff</code> | Pass: <code>alfstaff</code>
    </div>
    
    <button onclick="launch()">🔄 Launch Both Tabs</button>
  </div>

  <script>
    const ARIAL = 'https://10.1.129.207/Arial/#/login';
    const PCC = 'https://login.pointclickcare.com/poc/userLogin.xhtml';
    const USER = 'alfstaff';
    const PASS = 'alfstaff';
    let time = 300, timerId, ariaWin, pccWin;

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      document.getElementById('log').innerHTML += `[${t}] ${msg}<br>`;
    }

    function updateTimer() {
      const m = Math.floor(time/60).toString().padStart(2,'0');
      const s = (time%60).toString().padStart(2,'0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function launch() {
      log('🚀 Opening Arial...');
      ariaWin = window.open(ARIAL, '_blank');
      
      setTimeout(() => {
        log('🚀 Opening PCC...');
        pccWin = window.open(PCC, '_blank');
        
        // Try to inject auto-login (works only if same-origin)
        setTimeout(() => injectLogin(ariaWin, 'Arial'), 2000);
        setTimeout(() => injectLogin(pccWin, 'PCC'), 2500);
        
        log('✅ Both tabs opened!');
        log('🔐 Auto-login attempting...');
      }, 800);
    }

    function injectLogin(win, name) {
      if (!win || win.closed) { log(`❌ ${name} closed`); return; }
      try {
        // This will fail cross-origin, but worth trying
        win.focus();
        log(`✓ ${name} focused`);
      } catch(e) {
        log(`⚠️ ${name}: Cross-origin (manual login needed)`);
      }
    }

    // Auto-start
    log('Initializing...');
    updateTimer();
    timerId = setInterval(() => { time--; if(time<=0) time=300; updateTimer(); }, 1000);
    setTimeout(launch, 1000);

    // Service Worker
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-pwa.js');
  </script>
</body>
</html>
