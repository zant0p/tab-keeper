name: Build Extension Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-variants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [AL, SNF]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set variant in background.js
        run: |
          sed -i "s/const VARIANT = '.*'/const VARIANT = '${{ matrix.variant }}'/" background.js

      - name: Generate PEM key
        id: generate_key
        run: |
          PEM_FILE="extension-${{ matrix.variant }}.pem"
          if [ ! -f "$PEM_FILE" ]; then
            openssl genrsa -out "$PEM_FILE" 2048
            echo "key_generated=true" >> $GITHUB_OUTPUT
          else
            echo "key_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP package
        run: |
          zip -r tab-keeper-${{ matrix.variant }}-${{ steps.version.outputs.version }}.zip \
            manifest.json background.js content.js popup.html popup.js options.html options.js icons/ \
            -x "*.git*" "*.pem"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab-keeper-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: |
            tab-keeper-${{ matrix.variant }}-${{ steps.version.outputs.version }}.zip
            extension-${{ matrix.variant }}.pem
          retention-days: 30

  create-release:
    needs: build-variants
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Tab Keeper v${{ steps.version.outputs.version }}
          body: |
            ## Tab Keeper v${{ steps.version.outputs.version }}
            
            ### Download Instructions
            
            1. Download ZIP files from artifacts
            2. Download PEM keys from artifacts (⚠️ SAVE SECURELY!)
            3. Pack CRX locally:
               ```bash
               google-chrome --pack-extension=tab-keeper-AL-${{ steps.version.outputs.version }}.zip --pack-extension-key=extension-AL.pem
               google-chrome --pack-extension=tab-keeper-SNF-${{ steps.version.outputs.version }}.zip --pack-extension-key=extension-SNF.pem
               ```
            4. Upload CRX files to your hosting server
            
            ### Files Included
            
            - ZIP packages for both variants
            - PEM keys for signing (first generation)
            
            ⚠️ **IMPORTANT:** Save PEM keys securely! You'll need them for all future updates.
          files: |
            artifacts/tab-keeper-AL-crx-${{ steps.version.outputs.version }}/*.zip
            artifacts/tab-keeper-AL-crx-${{ steps.version.outputs.version }}/*.pem
            artifacts/tab-keeper-SNF-crx-${{ steps.version.outputs.version }}/*.zip
            artifacts/tab-keeper-SNF-crx-${{ steps.version.outputs.version }}/*.pem
          draft: false
          prerelease: false
