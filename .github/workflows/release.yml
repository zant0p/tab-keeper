name: Chrome Extension Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.0.1, etc.)

permissions:
  contents: write  # Required to create GitHub releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # Use Node.js 24 instead of deprecated Node.js 20

jobs:
  build-and-release:
    name: Build & Release Chrome Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Get version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(grep '"version":' ./manifest.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          TAG_VERSION="$${{ steps.get_version.outputs.VERSION }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Tag: v$TAG_VERSION"
            echo "   Manifest: $MANIFEST_VERSION"
            echo "   Please update manifest.json version to match the tag."
            exit 1
          fi
          echo "✅ Version match: v$TAG_VERSION"
      
      - name: Create ZIP package
        run: |
          zip -r tab-keeper-$${{ steps.get_version.outputs.VERSION }}.zip \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            icons/ \
            -x "*.md" \
            -x "*.py" \
            -x "*.sh" \
            -x ".github/*" \
            -x ".git/*"
      
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-keeper-$${{ steps.get_version.outputs.VERSION }}
          path: ./tab-keeper.zip
          retention-days: 30
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tab Keeper v$${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./tab-keeper.zip
          body: |
            ## Tab Keeper v$${{ steps.get_version.outputs.VERSION }}
            
            ### 📦 Installation
            
            1. Download `tab-keeper.zip` from Assets below
            2. Unzip the file
            3. In Chrome: `chrome://extensions/` → Developer mode
            4. Click "Load unpacked" → Select the unzipped folder
            5. Extension is now installed!
            
            ### 🔄 Updates
            
            For future updates, repeat the process with the new ZIP file.
            
            ### 📝 Changes
            
            - Version $${{ steps.get_version.outputs.VERSION }}
            - Released: ${{ steps.get_version.outputs.DATE }}
            
            ---
            
            **Auto-generated by GitHub Actions**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Output release instructions
        run: |
          echo ""
          echo "=============================================="
          echo "🎉 Release published successfully!"
          echo "=============================================="
          echo ""
          echo "✅ ZIP package attached to release"
          echo "✅ Release is live at:"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "📦 Installation: Download ZIP → Unzip → Load unpacked in Chrome"
          echo ""
          echo "=============================================="
