<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4285f4">
  <title>Tab Keeper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .container {
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
    }
    .status {
      margin-top: 32px;
      padding: 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔖 Tab Keeper</h1>
    <p>Launching target tabs...</p>
    <div class="status" id="status">Initializing...</div>
  </div>

  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('[Tab Keeper PWA] ServiceWorker registered'))
        .catch(err => console.error('[Tab Keeper PWA] ServiceWorker failed:', err));
    }

    // Get config from extension or use defaults
    async function getConfig() {
      return new Promise((resolve) => {
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          chrome.runtime.sendMessage({ action: 'getStatus' }, (response) => {
            if (chrome.runtime.lastError || !response) {
              resolve({
                primaryUrl: 'https://10.1.129.207/Arial/#/login',
                secondaryUrl: 'https://login.pointclickcare.com/poc/userLogin.xhtml'
              });
            } else {
              resolve(response);
            }
          });
        } else {
          resolve({
            primaryUrl: 'https://10.1.129.207/Arial/#/login',
            secondaryUrl: 'https://login.pointclickcare.com/poc/userLogin.xhtml'
          });
        }
      });
    }

    // Launch target tabs
    async function launchTabs() {
      const statusEl = document.getElementById('status');
      
      try {
        const config = await getConfig();
        
        statusEl.textContent = 'Opening primary tab...';
        
        // Open primary tab
        if (config.primaryUrl) {
          window.open(config.primaryUrl, '_blank');
          console.log('[Tab Keeper PWA] Launched primary:', config.primaryUrl);
        }
        
        // Wait a moment, then open secondary
        setTimeout(() => {
          if (config.secondaryUrl) {
            window.open(config.secondaryUrl, '_blank');
            console.log('[Tab Keeper PWA] Launched secondary:', config.secondaryUrl);
          }
          
          statusEl.textContent = '✅ Tabs launched successfully';
          
          // Hide status after 3 seconds
          setTimeout(() => {
            statusEl.style.display = 'none';
          }, 3000);
        }, 1000);
        
      } catch (error) {
        console.error('[Tab Keeper PWA] Error:', error);
        statusEl.textContent = '⚠️ Error launching tabs';
      }
    }

    // Auto-launch on load (kiosk mode)
    window.addEventListener('load', () => {
      console.log('[Tab Keeper PWA] Loaded, launching tabs...');
      setTimeout(launchTabs, 500);
    });
  </script>
</body>
</html>
